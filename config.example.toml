[server]
addr = ":8080"
# Use the same password as PostgreSQL's POSTGRES_PASSWORD startup parameter.
database_url = "postgres://footprint:CHANGE_ME@db:5432/footprint?sslmode=disable"
# Generate a token with: openssl rand -hex 32
ingest_token = ""

[mapbox]
# Public Mapbox token returned after API authentication. Leave empty for API-only use.
public_token = ""
style = "mapbox://styles/mapbox/light-v11"
